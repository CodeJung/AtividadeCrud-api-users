# =====================================================
# Identificação do Projeto (Deve ser único no seu Sonar)
# =====================================================
sonar.projectKey=node-layered-crud
sonar.projectName=Node Layered CRUD
sonar.projectVersion=1.0

# =====================================================
# Configurações de Caminhos
# =====================================================
# Onde está o código fonte principal
sonar.sources=src

# Padrão para identificar arquivos de teste (se você criá-los dentro de src)
# Exemplo: userController.test.js
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Exclui os testes da análise de código fonte "real"
sonar.exclusions=**/*.test.js,**/*.spec.js,**/node_modules/**,coverage/**

# =====================================================
# Relatórios de Cobertura (Jest)
# =====================================================
# Caminho exato onde o 'npm test' vai gerar o relatório lcov
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# =====================================================
# Outras Configurações
# =====================================================
# Codificação dos arquivos
sonar.sourceEncoding=UTF-8

# Evita falha se não houver testes na primeira execução
sonar.scm.disabled=true