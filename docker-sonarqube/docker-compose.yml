version: '3.8'

services:
  # --- SERVIÇO DE DESENVOLVIMENTO JAVA 17 --- Analyze 
  # Este é o novo serviço que será o seu ambiente de desenvolvimento.
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: java-dev-env
    # Mantém o contêiner rodando para que o VS Code possa se conectar a ele.
    command: sleep infinity
    # Mapeia o código do seu projeto para a pasta /workspace dentro do contêiner.
    volumes:
      - .:/workspace:cached
    # Opcional: Garante que o SonarQube esteja pronto se você precisar dele imediatamente.
    depends_on:
      - sonarqube

  # --- Serviço SonarQube ---
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonardb
      - SONAR_JDBC_USERNAME=BaseContainer
      - SONAR_JDBC_PASSWORD=BaseContainerPass
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - db

  # --- Banco de Dados para o SonarQube --- a mimha senha é: BaseContainerPass
  db:
    image: postgres:15
    container_name: sonardb
    environment:
      - POSTGRES_USER=BaseContainer
      - POSTGRES_PASSWORD=BaseContainerPass
      - POSTGRES_DB=sonardb
    volumes:
      - postgresql_data:/var/lib/postgresql/data

volumes:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data: